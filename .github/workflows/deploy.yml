name: Deploy

# dev and staging deploy automatically. Production waits for a manual approval
# on the `production` GitHub Environment.
#
# The job is skipped until DO_APP_ID is set as an environment variable, so an
# unconfigured repo reports "skipped" rather than a red X on every push.

on:
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.DO_APP_ID != ''
    environment:
      name: >-
        ${{ github.ref == 'refs/heads/main' && 'production'
         || github.ref == 'refs/heads/staging' && 'staging'
         || 'development' }}
      url: ${{ vars.APP_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy
        run: doctl apps create-deployment "${{ vars.DO_APP_ID }}" --wait
