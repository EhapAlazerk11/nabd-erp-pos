name: Feature
description: A piece of work to build
labels: ["feature"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options: [Intelligence, Store, ERP, POS, Hub, Marketing site, Mobile, Platform / shared]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem for the business owner
      description: In plain language. What can't they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: figma
    attributes:
      label: Figma frame
      placeholder: https://www.figma.com/design/msGrlP3TZrhab6C2incqq4/NabdAi-Platform?node-id=
  - type: checkboxes
    id: localisation
    attributes:
      label: Localisation
      options:
        - label: Arabic copy is written and reviewed
        - label: RTL layout is accounted for
