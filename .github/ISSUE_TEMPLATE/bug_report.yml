name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options: [Intelligence, Store, ERP, POS, Hub, Marketing site, Mobile, Platform / shared]
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Development, Staging, Production, Local]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: business
    attributes:
      label: Business ID (if the bug is tenant-specific)
  - type: checkboxes
    id: isolation
    attributes:
      label: Data isolation
      options:
        - label: One business could see another business's data (treat as P0)
